<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AURA AI</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <main class="aura-app">


        <!-- =========================
             HEADER
        ========================== -->

        <header class="top-bar">

            <div class="brand">

                <div class="brand-orb">
                    A
                </div>

                <div>

                    <h1>AURA</h1>

                    <span>
                        Personal AI Assistant
                    </span>

                </div>

            </div>


            <div
                id="status"
                class="system-status"
            >
                Ready
            </div>

        </header>


        <!-- =========================
             AI CORE
        ========================== -->

        <section class="core-section">

            <div class="core-ring ring-one"></div>

            <div class="core-ring ring-two"></div>

            <div class="core-ring ring-three"></div>


            <div
                id="auraCore"
                class="aura-core"
            >

                <div class="core-letter">
                    A
                </div>

                <div class="core-pulse"></div>

            </div>


            <div class="core-label">
                AURA
            </div>

        </section>


        <!-- =========================
             CONVERSATION
        ========================== -->

        <section class="conversation-panel">

            <div class="message-block user-message">

                <div class="message-title">
                    YOU
                </div>

                <div
                    id="command"
                    class="message-text"
                >
                    Say something...
                </div>

            </div>


            <div class="message-block aura-message">

                <div class="message-title">
                    AURA
                </div>

                <div
                    id="response"
                    class="message-text"
                >
                    Hello. I am ready.
                </div>

            </div>

        </section>


        <!-- =========================
             CONTROLS
        ========================== -->

        <section class="controls">


            <!-- NORMAL MICROPHONE -->

            <button
                id="micButton"
                class="control-button mic-button"
                type="button"
                aria-label="Normal microphone"
                aria-pressed="false"
            >

                <span class="button-icon">

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <path
                            d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3Z"
                        />

                        <path
                            d="M19 11a7 7 0 0 1-14 0"
                        />

                        <path
                            d="M12 18v4"
                        />

                        <path
                            d="M8 22h8"
                        />

                    </svg>

                </span>


                <span class="button-content">

                    <strong>
                        Microphone
                    </strong>

                    <small
                        id="micLabel"
                        class="mic-label"
                    >
                        Mic OFF
                    </small>

                </span>

            </button>


            <!-- CONTINUOUS MODE -->

            <button
                id="continuousButton"
                class="control-button continuous-button"
                type="button"
                aria-label="Continuous microphone mode"
                aria-pressed="false"
            >

                <span class="button-icon">

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <path
                            d="M4 12a8 8 0 0 1 13.7-5.7"
                        />

                        <path
                            d="M20 12a8 8 0 0 1-13.7 5.7"
                        />

                        <path
                            d="M17 3v4h-4"
                        />

                        <path
                            d="M7 21v-4h4"
                        />

                    </svg>

                </span>


                <span class="button-content">

                    <strong>
                        Continuous Mode
                    </strong>

                    <small
                        id="continuousLabel"
                        class="continuous-label"
                    >
                        Continuous OFF
                    </small>

                </span>

            </button>


            <div class="voice-settings">

                <label for="voiceSelect">
                    AURA Voice
                </label>

                <select id="voiceSelect">
                    <option value="">
                        Loading voices...
                    </option>
                </select>

                <button
                    id="testVoiceButton"
                    type="button"
                >
                    Test Voice
                </button>

            </div>


        </section>


        <!-- =========================
             MODE INFORMATION
        ========================== -->

        <section class="mode-info">

            <div class="mode-item">

                <span class="mode-dot"></span>

                <span>
                    Normal
                </span>

            </div>


            <div class="mode-item">

                <span class="mode-dot"></span>

                <span>
                    Continuous
                </span>

            </div>


            <div class="mode-item">

                <span class="mode-dot"></span>

                <span>
                    15s idle timeout
                </span>

            </div>

        </section>


        <!-- =========================
             FOOTER
        ========================== -->

        <footer>

            <span>
                AURA AI
            </span>

            <span>
                •
            </span>

            <span>
                Voice Assistant
            </span>

        </footer>


    </main>


    <!-- IMPORTANT:
         Only ONE JavaScript file -->

    <script src="script.js"></script>

</body>

</html>
